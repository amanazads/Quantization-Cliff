inherits: ../base.yaml

model:
  family: "qwen2.5"
  parameters: "1.5b"
  variant: "instruct"

precision:
  id: q8
  label: "Q8_0"
  nominal_bits: 8
  family: integer_block_quantization

backends:
  ollama:
    available: true
    model_tag: "qwen2.5:1.5b-instruct-q8_0"
    quantization_format: "GGUF Q8_0"
    approx_download_gb: 1.6
    quantization_config:
      method: "llama.cpp legacy block quant"
      bits: 8
      block_size: 32
      mixed_precision_tensors: false
      notes: >-
        Uniform 8-bit INTEGER block quantization with one FP16 scale per 32-weight
        block, weights only.
    deviations: []

  mock:
    available: true
    model_tag: "mock:q8"
    quantization_format: "SYNTHETIC -- not a real quantization"
    quantization_config:
      method: "none -- fabricated fixture"
    deviations:
      - id: DEV-Q8-MOCK-1
        severity: blocking
        description: >-
          Output came from the deterministic mock backend. These numbers are a
          pipeline-validation fixture, not a measurement of any model, and must
          never be reported as a PS-5 result.
