inherits: ../base.yaml

precision:
  id: q4
  label: "Q4"
  nominal_bits: 4
  family: integer_block_quantization

backends:
  ollama:
    available: true
    model_tag: "qwen3.5:4b-q4_K_M"
    quantization_format: "GGUF Q4_K_M"
    approx_download_gb: 3.4
    quantization_config:
      method: "llama.cpp k-quant"
      bits: 4
      block_size: 32
      mixed_precision_tensors: true
      notes: >-
        Q4_K_M is NOT uniformly 4-bit. llama.cpp promotes a subset of tensors
        (attn_v and part of ffn_down) to Q6_K, so the effective bits-per-weight is
        roughly 4.85 rather than 4.0. Recorded because calling it "4-bit"
        overstates the compression actually under test. This is also the precision
        the specification says Track 1 runs at, and the one PS-5 exists to put an
        asterisk on.
    deviations: []

  vllm:
    # No verified official AWQ/GPTQ release for Qwen3.5-4B, so this arm stays
    # unavailable on vLLM until you produce a checkpoint. Q4 runs genuinely on the
    # Ollama backend, so the Q4 rung is not lost overall.
    available: false
    unavailable_reason: >-
      No verified off-the-shelf 4-bit (AWQ or GPTQ) checkpoint for Qwen3.5-4B was
      confirmed at the time this config was written.
    substitution_policy: >-
      Do NOT substitute a different model's AWQ build or the FP8 checkpoint.
      Produce or verify a 4-bit checkpoint, set model_tag, and flip available to
      true. Until then this arm is reported as NOT RUN on the vLLM backend.
    model_tag: null
    quantization_format: "AWQ W4A16"
    quantization_config:
      method: "AWQ"
      weight_bits: 4
      activation_bits: 16
      group_size: 128
    deviations:
      - id: DEV-Q4-VLLM-1
        severity: material
        description: >-
          AWQ W4A16 and GGUF Q4_K_M are different 4-bit algorithms with different
          calibration and different mixed-precision policies. Q4 measured on vLLM
          is not interchangeable with Q4 measured on Ollama, and the two must not
          be pooled.

  mock:
    available: true
    model_tag: "mock:q4"
    quantization_format: "SYNTHETIC -- not a real quantization"
    quantization_config:
      method: "none -- fabricated fixture"
    deviations:
      - id: DEV-Q4-MOCK-1
        severity: blocking
        description: >-
          Output came from the deterministic mock backend. These numbers are a
          pipeline-validation fixture, not a measurement of any model, and must
          never be reported as a PS-5 result.
