inherits: ../base.yaml

precision:
  id: fp8
  label: "FP8"
  nominal_bits: 8
  family: floating_point

backends:
  ollama:
    # Qwen3.5 publishes an mxfp8 GGUF tag, so FP8 IS runnable on this stack.
    # An earlier revision of this repository declared FP8 impossible on
    # llama.cpp; that was true of the Qwen2.5 GGUF line and is no longer true
    # here. DEV-FP8-OLLAMA-1 is retired and replaced by the format note below.
    available: true
    model_tag: "qwen3.5:4b-mxfp8"
    quantization_format: "MXFP8 (OCP microscaling FP8)"
    approx_download_gb: 5.6
    quantization_config:
      method: "OCP Microscaling (MX) FP8"
      element_dtype: "float8 (E4M3 elements)"
      weight_bits: 8
      block_scaled: true
      notes: >-
        MXFP8 stores FP8 elements in small blocks that share a power-of-two scale
        factor. It is genuinely an 8-bit floating-point format, which is what this
        arm is meant to test.
    deviations:
      - id: DEV-FP8-OLLAMA-MXFP8
        severity: material
        description: >-
          This arm is MXFP8 (block-scaled microscaling FP8), NOT the per-tensor
          FP8-E4M3 that vLLM serves on Hopper/Ada GPUs. Both are 8-bit floating
          point, but the scaling granularity differs, so the two are not
          interchangeable measurements.
        impact: >-
          The FP8 rung is measured as MXFP8 on this backend. Do not pool it with,
          or compare it directly against, an FP8 arm collected on vLLM.

  vllm:
    available: true
    model_tag: "Qwen/Qwen3.5-4B"
    quantization_format: "FP8 E4M3 W8A8 (quantized at load time)"
    quantization_config:
      # vLLM quantizes to FP8 at LOAD TIME from the unquantized BF16 checkpoint,
      # so no separate FP8 release is needed and the weights provably start from
      # the SAME checkpoint as the BF16 arm -- a stronger control than sourcing a
      # third-party FP8 upload whose calibration cannot be verified.
      method: "vLLM on-the-fly FP8 (--quantization fp8) from the BF16 checkpoint"
      dtype: "float8_e4m3fn"
      weight_bits: 8
      activation_bits: 8
      scheme: per_tensor_weight_per_token_dynamic_activation
      launch: "vllm serve Qwen/Qwen3.5-4B --quantization fp8 --enable-auto-tool-choice"
      notes: >-
        Requires a GPU with native FP8 tensor cores (compute capability >= 8.9:
        Ada L4/L40S, Hopper H100/H200, Blackwell). On Ampere (A100, cc 8.0) vLLM
        accepts the checkpoint but emulates FP8 by upcasting, which is a DIFFERENT
        numerical treatment. The runner records the detected compute capability.
    deviations:
      - id: DEV-FP8-VLLM-2
        severity: material
        condition: "gpu_compute_capability < 8.9"
        description: >-
          FP8 was emulated rather than executed on native FP8 tensor cores. The
          arm measures the FP8 numerical format but not FP8 hardware execution.

  mock:
    available: true
    model_tag: "mock:fp8"
    quantization_format: "SYNTHETIC -- not a real quantization"
    quantization_config:
      method: "none -- fabricated fixture"
    deviations:
      - id: DEV-FP8-MOCK-1
        severity: blocking
        description: >-
          Output came from the deterministic mock backend. These numbers are a
          pipeline-validation fixture, not a measurement of any model, and must
          never be reported as a PS-5 result.
