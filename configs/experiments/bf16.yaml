inherits: ../base.yaml

# BF16 is the REFERENCE arm. Every delta in the analysis is measured against it,
# so its integrity matters more than any other arm's.

precision:
  id: bf16
  label: "BF16"
  nominal_bits: 16
  family: floating_point
  is_reference: true

backends:
  ollama:
    # Qwen3.5 publishes a GENUINE bf16 GGUF tag. Earlier revisions of this
    # repository used an fp16 (IEEE half) tag and carried DEV-BF16-OLLAMA-1 to
    # record that the reference arm was not really BF16. That deviation is now
    # RETIRED: this tag is bfloat16, matching the checkpoint's training dtype.
    available: true
    model_tag: "qwen3.5:4b-bf16"
    quantization_format: "GGUF BF16 (unquantized)"
    approx_download_gb: 9.3
    quantization_config:
      method: "none (full-precision reference)"
      dtype: "bfloat16"
      bits: 16
      notes: >-
        True bfloat16: 8 exponent bits and 7 mantissa bits, the dtype Qwen3.5 was
        trained in. No format conversion is involved, so this arm is a faithful
        reference rather than a near-enough one.
    deviations:
      - id: DEV-BF16-OLLAMA-METAL
        severity: minor
        description: >-
          llama.cpp's Metal backend has partial BF16 support and may upcast some
          operations. That affects the compute path, not the stored weights, and
          it applies to this arm only. Verify the selected backend in the Ollama
          server log and record what you observe rather than assuming.

  vllm:
    available: true
    model_tag: "Qwen/Qwen3.5-4B"
    quantization_format: "BF16 (unquantized)"
    quantization_config:
      method: "none"
      dtype: "bfloat16"
      bits: 16
      launch: "vllm serve Qwen/Qwen3.5-4B --dtype bfloat16 --enable-auto-tool-choice"
    deviations: []

  mock:
    # Pipeline validation only. Output is FABRICATED -- see src/ps5/backends/mock.py.
    available: true
    model_tag: "mock:bf16"
    quantization_format: "SYNTHETIC -- not a real quantization"
    quantization_config:
      method: "none -- fabricated fixture"
    deviations:
      - id: DEV-BF16-MOCK-1
        severity: blocking
        description: >-
          Output came from the deterministic mock backend. These numbers are a
          pipeline-validation fixture, not a measurement of any model, and must
          never be reported as a PS-5 result.
