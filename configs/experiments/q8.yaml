inherits: ../base.yaml

precision:
  id: q8
  label: "Q8"
  nominal_bits: 8
  family: integer_block_quantization

backends:
  ollama:
    available: true
    model_tag: "qwen3.5:4b-q8_0"
    quantization_format: "GGUF Q8_0"
    approx_download_gb: 5.3
    quantization_config:
      method: "llama.cpp legacy block quant"
      bits: 8
      block_size: 32
      mixed_precision_tensors: false
      notes: >-
        Q8_0 is uniform 8-bit INTEGER block quantization with one FP16 scale per
        32-weight block, weights only. It sits at the same nominal bit width as
        the FP8 arm but is a different number system, which is exactly why the two
        are reported as separate rungs rather than merged.
    deviations: []

  vllm:
    # vLLM has NO load-time INT8 W8A8 path from an unquantized checkpoint (unlike
    # FP8), and there is no verified official Qwen3.5-4B INT8 release to point at.
    # Rather than name a checkpoint that may not exist, this arm stays unavailable
    # until you produce one.
    available: false
    unavailable_reason: >-
      No verified off-the-shelf INT8 W8A8 checkpoint exists for Qwen3.5-4B, and
      vLLM cannot quantize to INT8 W8A8 at load time the way it can for FP8.
    substitution_policy: >-
      Do NOT substitute the FP8 or unquantized checkpoint here. Produce a genuine
      INT8 W8A8 checkpoint, set model_tag to it, and flip available to true. Until
      then this arm is reported as NOT RUN on the vLLM backend. On the Ollama
      backend Q8 runs genuinely, so the Q8 rung is not lost overall.
    model_tag: null
    quantization_format: "INT8 W8A8 (compressed-tensors)"
    quantization_config:
      method: "llm-compressor INT8"
      weight_bits: 8
      activation_bits: 8
      how_to_produce: >-
        pip install llmcompressor, apply GPTQ/SmoothQuant W8A8 to Qwen/Qwen3.5-4B,
        save the compressed-tensors checkpoint, then serve it with
        --quantization compressed-tensors.
    deviations:
      - id: DEV-Q8-VLLM-1
        severity: material
        description: >-
          vLLM INT8 W8A8 also quantizes ACTIVATIONS to 8-bit, whereas GGUF Q8_0
          quantizes weights only and computes in higher precision. These are not
          the same treatment. Do not pool Q8 across backends.

  mock:
    available: true
    model_tag: "mock:q8"
    quantization_format: "SYNTHETIC -- not a real quantization"
    quantization_config:
      method: "none -- fabricated fixture"
    deviations:
      - id: DEV-Q8-MOCK-1
        severity: blocking
        description: >-
          Output came from the deterministic mock backend. These numbers are a
          pipeline-validation fixture, not a measurement of any model, and must
          never be reported as a PS-5 result.
